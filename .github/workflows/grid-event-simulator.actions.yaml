name: Deploy Grid Event Simulator Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grid-event-simulator/simulator-api/**'
      - 'grid-event-simulator/website/**'
      - '.github/workflows/grid-event-simulator.actions.yaml'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET for API
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore and build API
        run: |
          dotnet restore
          dotnet build --configuration Release
        working-directory: grid-event-simulator/simulator-api/src

      - name: Publish API
        run: |
          dotnet publish --configuration Release --output ./publish
          cd ./publish
          zip -r ../deploy.zip .
        working-directory: grid-event-simulator/simulator-api/src

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS2 }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-orch-multi-agent-eus2-mx01'
          package: 'grid-event-simulator/simulator-api/src/deploy.zip'

      - name: Build And Deploy Frontend
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ORCH_MULTI_AGENT_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: grid-event-simulator/website
          output_location: grid-event-simulator/website/dist