<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather & Renewable Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom styles -->
    <link href="main.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-5">
      <!-- Negotiate status indicator (initial state displayed while checking) -->
      <div id="negotiateStatus" class="mb-4" aria-live="polite">
        <div class="alert alert-secondary d-flex align-items-center" role="status">
          <div class="spinner-border spinner-border-sm text-secondary me-2" role="status" aria-hidden="true"></div>
          <div>Checking negotiate endpoint...</div>
        </div>
      </div>

      <!-- Top Section: Adjust Weather Conditions -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">Adjust Weather Conditions</h3>

          <form id="weatherForm" class="row g-3">
            <div class="col-md-6">
              <label for="cloudCoverage" class="form-label">Cloud Coverage</label>
              <select id="cloudCoverage" class="form-select" aria-label="Cloud Coverage select">
                <option value="clear">Clear</option>
                <option value="partly">Partly Cloudy</option>
                <option value="mostly">Mostly Cloudy</option>
                <option value="cloudy">Cloudy</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="temperatureF" class="form-label">Temperature (°F)</label>
              <input type="number" class="form-control" id="temperatureF" placeholder="°F" step="0.1" aria-describedby="tempHelp">
              <div id="tempHelp" class="form-text">Enter current temperature in Fahrenheit.</div>
            </div>

            <div class="col-md-6">
              <label for="windSpeed" class="form-label">Wind Speed</label>
              <input type="number" class="form-control" id="windSpeed" placeholder="mph" min="0" step="0.1" aria-describedby="windHelp">
              <div id="windHelp" class="form-text">Enter wind speed in miles per hour (mph).</div>
            </div>

            <div class="col-md-6">
              <label for="timeOfDay" class="form-label">Time of Day</label>
              <select id="timeOfDay" class="form-select" aria-describedby="timeHelp">
                <!-- Options in 24-hour format with 15-minute increments -->
                <!-- Generated as HH:MM from 00:00 to 23:45 -->
                ${/* options inserted by server-side tool */ ''}
              </select>
              <div id="timeHelp" class="form-text">Select hour (24-hour). Minutes selectable in 15-minute increments.</div>
            </div>

            <div class="col-12 text-end">
              <button type="button" id="sendWeatherBtn" class="btn btn-primary">Send Weather</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Thin line between sections -->
      <hr class="my-4">

      <!-- Bottom Section: Renewable Details -->
      <div class="card shadow-sm mt-3">
        <div class="card-body">
          <h4 class="card-title mb-4">Renewable Details</h4>

          <div class="row g-3">
            <div class="col-md-4">
              <label for="percentRenewables" class="form-label">Percent Renewables to cover current load</label>
              <div class="input-group">
                <input type="text" readonly class="form-control" id="percentRenewables" value="--" aria-label="Percent Renewables">
                <span class="input-group-text">%</span>
              </div>
            </div>

            <div class="col-md-4">
              <label for="totalGridDemand" class="form-label">Total Grid Demand</label>
              <div class="input-group">
                <input type="text" readonly class="form-control" id="totalGridDemand" value="--" aria-label="Total Grid Demand">
                <span class="input-group-text">MW</span>
              </div>
            </div>

            <div class="col-md-4">
              <label for="totalRenewableOutput" class="form-label">Total Renewable Output</label>
              <div class="input-group">
                <input type="text" readonly class="form-control" id="totalRenewableOutput" value="--" aria-label="Total Renewable Output">
                <span class="input-group-text">MW</span>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
